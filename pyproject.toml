[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-coding-agent"
version = "0.1.0"
description = "A declarative Gemma coding agent for Python repository repair"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
gemma-agent = "gemma_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
